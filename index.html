<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>時給ログ</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <h1>時給ログ</h1>
  <p class="lead">作業時間と報酬を記録すると、週の合計と時給を計算します。</p>

  <form id="entry-form">
    <label>日付<input type="date" id="date" required></label>
    <label>内容<input type="text" id="task" placeholder="例: 記事執筆" required></label>
    <label>作業時間（分）<input type="number" id="minutes" min="1" step="1" required></label>
    <label>報酬（円）<input type="number" id="reward" min="0" step="1" value="0" required></label>
    <button type="submit">記録する</button>
  </form>

  <section id="summary" aria-live="polite"></section>
  <ul id="list"></ul>
</main>
<script src="./app.js"></script>
</body>
</html>
